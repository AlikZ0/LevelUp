<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LevelUp — прокачай свои цели</title>
  <meta name="description" content="Игровой трекер целей: выполняй ежедневные действия, получай опыт, прокачивай уровень. Все данные хранятся локально." />
  <meta name="theme-color" id="themeColorMeta" content="#fafafa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><circle cx='12' cy='12' r='5'/><circle cx='12' cy='12' r='1.5' fill='%234f46e5'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <script>try{var t=localStorage.getItem('levelup.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="app">
    <!-- ===== Header ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" data-icon="target" data-icon-size="26"></span>
        <div>
          <h1>LevelUp</h1>
          <p class="tagline">Прокачивай себя каждый день</p>
        </div>
      </div>

      <div class="level-block" title="Твой уровень">
        <div class="level-ring">
          <svg viewBox="0 0 56 56" class="ring-svg" aria-hidden="true">
            <circle class="ring-bg" cx="28" cy="28" r="24" />
            <circle class="ring-fg" id="levelRing" cx="28" cy="28" r="24" />
          </svg>
          <span class="level-num" id="levelNum">1</span>
        </div>
        <div class="level-progress">
          <div class="level-progress-top">
            <span id="levelTitle">Новичок</span>
            <span id="xpText" class="xp-text">0 / 100 XP</span>
          </div>
          <div class="level-progress-bottom">
            <span id="totalXp">Всего опыта: 0 XP</span>
          </div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="btn icon" id="themeToggle" aria-label="Переключить тему" title="Светлая / тёмная тема"></button>
        <button class="btn ghost" id="exportBtn" title="Скачать резервную копию (JSON)"><span data-icon="download"></span>Экспорт</button>
        <button class="btn ghost" id="importBtn" title="Загрузить данные из файла"><span data-icon="upload"></span>Импорт</button>
        <input type="file" id="importInput" accept="application/json,.json" hidden />
      </div>
    </header>

    <!-- ===== Date navigation ===== -->
    <section class="daybar">
      <button class="btn round" id="prevDay" aria-label="Предыдущий день"><span data-icon="chevron-left" data-icon-size="22"></span></button>
      <div class="daybar-center">
        <h2 id="dayTitle">Сегодня</h2>
        <span id="dayDate" class="day-date"></span>
      </div>
      <button class="btn round" id="nextDay" aria-label="Следующий день"><span data-icon="chevron-right" data-icon-size="22"></span></button>
      <button class="btn ghost small" id="todayBtn" title="Вернуться к сегодняшнему дню">Сегодня</button>
    </section>

    <!-- ===== Stats row ===== -->
    <section class="stats-row" id="statsRow"></section>

    <!-- ===== Goals ===== -->
    <section class="goals-section">
      <div class="section-head">
        <h3>Мои цели</h3>
        <button class="btn primary" id="addGoalBtn"><span data-icon="plus"></span>Новая цель</button>
      </div>
      <div class="goals-grid" id="goalsGrid"></div>
      <p class="empty-hint" id="emptyHint" hidden>
        Пока нет ни одной цели. Нажми «Новая цель», чтобы добавить первую.
      </p>
    </section>

    <!-- ===== Weekly overview ===== -->
    <section class="week-section">
      <div class="section-head">
        <h3>Обзор недели</h3>
        <span class="muted" id="weekRange"></span>
      </div>
      <div class="week-table-wrap">
        <table class="week-table" id="weekTable"></table>
      </div>
      <div class="week-summary" id="weekSummary"></div>
    </section>

    <footer class="footer">
      <span id="saveStatus" class="save-status">Данные сохраняются локально в этом браузере</span>
      <button class="btn ghost small danger" id="resetBtn" title="Полностью очистить все данные"><span data-icon="trash"></span>Сбросить всё</button>
    </footer>
  </div>

  <!-- ===== Goal editor modal ===== -->
  <div class="modal-backdrop" id="goalModal" hidden>
    <div class="modal">
      <h3 id="goalModalTitle">Новая цель</h3>
      <label class="field">
        <span>Название</span>
        <input type="text" id="goalName" maxlength="40" placeholder="Например: Спорт, Английский, Чтение…" />
      </label>
      <label class="field">
        <span>Иконка</span>
        <div class="icon-picker" id="iconPicker"></div>
      </label>
      <label class="field">
        <span>Цвет</span>
        <div class="color-picker" id="colorPicker"></div>
      </label>
      <label class="field">
        <span>Опыт за выполнение (XP)</span>
        <input type="number" id="goalXp" min="1" max="1000" value="10" inputmode="numeric" />
      </label>
      <div class="modal-actions">
        <button class="btn ghost danger" id="deleteGoalBtn" hidden><span data-icon="trash"></span>Удалить</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="cancelGoalBtn">Отмена</button>
        <button class="btn primary" id="saveGoalBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
